ptz:
  name: 云台转动
  description: 让萤石摄像头向某个方向转动一段时间（走云端 ptzControl）。
  fields:
    direction:
      name: 方向
      description: up / down / left / right
      required: true
      selector:
        select:
          options: [up, down, left, right]
    ms:
      name: 转动时长(毫秒)
      description: 50-5000，默认 300
      default: 300
      selector:
        number: {min: 50, max: 5000, step: 50, unit_of_measurement: ms}
    speed:
      name: 速度
      description: 1-10，默认 5
      default: 5
      selector:
        number: {min: 1, max: 10, step: 1}
    serial:
      name: 序列号
      description: 多台设备时指定，默认第一台
      required: false
      selector:
        text:
